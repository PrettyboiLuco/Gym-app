<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/examples/jsm/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Nach getlayers.ai „SVG to 3D“ (Preset Heart, Farbe #C6F24E, Hintergrund #000000, Spin aus) – Werte 1:1 aus dem Build-Prompt.
import * as THREE from 'three';
import { SVGLoader } from 'three/examples/jsm/loaders/SVGLoader.js';
import { RectAreaLightUniformsLib } from 'three/examples/jsm/lights/RectAreaLightUniformsLib.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/examples/jsm/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/examples/jsm/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/examples/jsm/shaders/FXAAShader.js';

window.renderLogo = function ({ svg, size, rotX = 0, rotY = 0, distance = 420, background = '#000000' }) {
  THREE.ColorManagement.enabled = true;
  const SS = 2; // Supersampling: doppelt rendern, dann verkleinern
  const W = size * SS;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.useLegacyLights = false;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.setPixelRatio(1);
  renderer.setSize(W, W, false);
  RectAreaLightUniformsLib.init();

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(background);
  scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
  const camera = new THREE.PerspectiveCamera(36, 1, 1, 5000);
  camera.position.set(0, 0, distance);
  camera.lookAt(0, 0, 0);

  // Geometrie
  const data = new SVGLoader().parse(svg.replaceAll('currentColor', '#ffffff'));
  const shapes = [];
  for (const p of data.paths) shapes.push(...SVGLoader.createShapes(p));
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, complexity = 0, smallestHole = Infinity;
  for (const s of shapes) {
    complexity += s.curves.length;
    for (const pt of s.getPoints(16)) { minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x); minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y); }
    for (const h of s.holes) {
      complexity += h.curves.length;
      const b = new THREE.Box2().setFromPoints(h.getPoints(16)); const d = b.getSize(new THREE.Vector2());
      smallestHole = Math.min(smallestHole, d.x, d.y);
    }
  }
  const sourceSize = Math.max(maxX - minX, maxY - minY);
  const scaleFactor = 200 / sourceSize;
  const bevelSegments = complexity > 900 ? 8 : complexity > 450 ? 14 : complexity > 160 ? 24 : 32;
  const curveSegments = complexity > 900 ? 8 : complexity > 450 ? 12 : complexity > 160 ? 16 : 20;
  const steps = complexity > 900 ? 1 : 2;
  const bevelSize = Math.max(0.18 / scaleFactor, Math.min(4 / scaleFactor, smallestHole * 0.38));
  const geometry = new THREE.ExtrudeGeometry(shapes, {
    depth: 60 / scaleFactor, bevelEnabled: true, bevelSize, bevelThickness: bevelSize * (2.4 / 1.45),
    bevelOffset: -0.2 * bevelSize, bevelSegments, curveSegments, steps,
  });
  geometry.center();
  geometry.scale(scaleFactor, -scaleFactor, scaleFactor);
  // Wicklung umdrehen (1↔2), damit die Normalen nach außen zeigen
  for (const name of ['position', 'uv']) {
    const a = geometry.getAttribute(name); if (!a) continue;
    for (let i = 0; i < a.count; i += 3) for (let k = 0; k < a.itemSize; k++) {
      const t = a.array[(i + 1) * a.itemSize + k]; a.array[(i + 1) * a.itemSize + k] = a.array[(i + 2) * a.itemSize + k]; a.array[(i + 2) * a.itemSize + k] = t;
    }
  }
  // Normalen: Deckel flach, Rest winkelgewichtet geglättet (nach Position verschweißt, 1e-4)
  const pos = geometry.getAttribute('position');
  const normals = new Float32Array(pos.count * 3);
  const acc = new Map(); const faceInfo = [];
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), fn = new THREE.Vector3();
  const key = (i) => `${Math.round(pos.getX(i) * 1e4)},${Math.round(pos.getY(i) * 1e4)},${Math.round(pos.getZ(i) * 1e4)}`;
  for (let i = 0; i < pos.count; i += 3) {
    vA.fromBufferAttribute(pos, i); vB.fromBufferAttribute(pos, i + 1); vC.fromBufferAttribute(pos, i + 2);
    fn.crossVectors(e1.subVectors(vC, vB), e2.subVectors(vA, vB)).normalize();
    const cap = Math.abs(fn.z) > 0.94;
    faceInfo.push(cap ? Math.sign(fn.z) : 0);
    if (cap) continue;
    const verts = [vA, vB, vC];
    for (let j = 0; j < 3; j++) {
      const p = verts[j], q = verts[(j + 1) % 3], r = verts[(j + 2) % 3];
      const angle = new THREE.Vector3().subVectors(q, p).angleTo(new THREE.Vector3().subVectors(r, p));
      const k = key(i + j); const v = acc.get(k) ?? new THREE.Vector3(); v.addScaledVector(fn, isNaN(angle) ? 0 : angle); acc.set(k, v);
    }
  }
  for (let i = 0; i < pos.count; i += 3) {
    const cap = faceInfo[i / 3];
    for (let j = 0; j < 3; j++) {
      const n = cap ? new THREE.Vector3(0, 0, cap) : acc.get(key(i + j)).clone().normalize();
      normals.set([n.x, n.y, n.z], (i + j) * 3);
    }
  }
  geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));

  // Farben (HSL im linearen Raum, wie im Prompt)
  const base = new THREE.Color('#C6F24E'); const hsl = {}; base.getHSL(hsl);
  const neutral = hsl.s < 0.28; const sat = neutral ? 0 : THREE.MathUtils.clamp(hsl.s * 0.96, 0.18, 0.94);
  const tone = (l, k) => new THREE.Color().setHSL(hsl.h, neutral ? 0 : THREE.MathUtils.clamp(sat * k, 0, 1), l);
  const core = tone(0.14, 0.88), side = tone(0.28, 0.72), emissive = tone(0.03, 0.8);
  const key_ = tone(0.52, 0.5), rim = tone(0.56, 1), fill = tone(0.24, 0.82);

  const caps = new THREE.MeshPhysicalMaterial({ side: THREE.FrontSide, color: core, metalness: 0.94, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.08, transmission: 0, ior: 1.48, thickness: 0, envMapIntensity: 2.3, iridescence: 0 });
  const walls = new THREE.MeshPhysicalMaterial({ side: THREE.FrontSide, color: side, emissive, emissiveIntensity: 0.11, metalness: 0.94, roughness: 0.18, clearcoat: 1, transmission: 0, thickness: 0, envMapIntensity: 2.05, iridescence: 0 });
  const mesh = new THREE.Mesh(geometry, [caps, walls]);
  const objectGroup = new THREE.Group(); objectGroup.add(mesh); scene.add(objectGroup);
  objectGroup.rotation.set(rotX, rotY, 0);

  const lights = new THREE.Group(); scene.add(lights);
  lights.add(new THREE.AmbientLight('#8babff', 0.056));
  const area = (c, i, w, h, p, t) => { const l = new THREE.RectAreaLight(c, i, w, h); l.position.set(...p); l.lookAt(...t); lights.add(l); };
  area(fill, 3.5, 240, 300, [-90, -40, 170], [0, 0, 0]);
  area(rim, 16.8, 72, 520, [-165, 20, -60], [-18, 0, 0]);
  area(rim, 15.4, 72, 520, [165, 10, -58], [18, 0, 0]);
  area(key_, 7, 150, 300, [120, 90, 160], [0, 0, 0]);

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.3, 0.5, 0.9);
  bloom.strength = 0.2; bloom.radius = 0.5; bloom.threshold = 0.86;
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  const fxaa = new ShaderPass(FXAAShader); composer.addPass(fxaa);
  composer.setPixelRatio(1); composer.setSize(W, W);
  fxaa.material.uniforms.resolution.value.set(1 / W, 1 / W);
  composer.render();

  const out = document.createElement('canvas'); out.width = size; out.height = size;
  const ctx = out.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(renderer.domElement, 0, 0, size, size);
  return { png: out.toDataURL('image/png'), core: '#' + core.getHexString(), side: '#' + side.getHexString() };
};
window.ready = true;
</script></body></html>
