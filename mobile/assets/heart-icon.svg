<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2E4A"/>
      <stop offset="1" stop-color="#0B1422"/>
    </linearGradient>
    <radialGradient id="muscle" gradientUnits="userSpaceOnUse" cx="470" cy="600" r="420">
      <stop offset="0" stop-color="#EE5A4E"/>
      <stop offset="0.55" stop-color="#C42B27"/>
      <stop offset="1" stop-color="#6E1212"/>
    </radialGradient>
    <radialGradient id="atrium" gradientUnits="userSpaceOnUse" cx="360" cy="540" r="160">
      <stop offset="0" stop-color="#D2403A"/>
      <stop offset="1" stop-color="#8A1A1A"/>
    </radialGradient>
    <linearGradient id="arteryV" gradientUnits="userSpaceOnUse" x1="-30" y1="0" x2="30" y2="0">
      <stop offset="0" stop-color="#981B1B"/>
      <stop offset="0.45" stop-color="#E9524A"/>
      <stop offset="1" stop-color="#A21E1E"/>
    </linearGradient>
    <linearGradient id="arch" gradientUnits="userSpaceOnUse" x1="0" y1="215" x2="0" y2="340">
      <stop offset="0" stop-color="#F06258"/>
      <stop offset="0.6" stop-color="#C83430"/>
      <stop offset="1" stop-color="#8E1A1A"/>
    </linearGradient>
    <linearGradient id="ascend" gradientUnits="userSpaceOnUse" x1="450" y1="0" x2="560" y2="0">
      <stop offset="0" stop-color="#9A1C1C"/>
      <stop offset="0.45" stop-color="#E9524A"/>
      <stop offset="1" stop-color="#A21E1E"/>
    </linearGradient>
    <linearGradient id="veinV" gradientUnits="userSpaceOnUse" x1="355" y1="0" x2="435" y2="0">
      <stop offset="0" stop-color="#22417A"/>
      <stop offset="0.5" stop-color="#5287D2"/>
      <stop offset="1" stop-color="#26488A"/>
    </linearGradient>
    <linearGradient id="veinH" gradientUnits="userSpaceOnUse" x1="0" y1="340" x2="0" y2="400">
      <stop offset="0" stop-color="#5A8FDA"/>
      <stop offset="1" stop-color="#244583"/>
    </linearGradient>
    <linearGradient id="trunk" gradientUnits="userSpaceOnUse" x1="540" y1="0" x2="660" y2="0">
      <stop offset="0" stop-color="#26488A"/>
      <stop offset="0.45" stop-color="#5E93DE"/>
      <stop offset="1" stop-color="#22417A"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="ventricles"><path d="M 380 480
             C 300 530, 290 640, 330 720
             C 390 815, 500 870, 610 905
             C 660 920, 698 902, 722 862
             C 796 742, 812 610, 768 512
             C 744 466, 694 452, 652 470
             C 630 520, 540 530, 520 500
             C 470 470, 420 470, 380 480 Z"/></clipPath>
    <linearGradient id="pvein" gradientUnits="userSpaceOnUse" x1="0" y1="-14" x2="0" y2="14">
      <stop offset="0" stop-color="#D84A42"/>
      <stop offset="1" stop-color="#7E1717"/>
    </linearGradient>
  </defs>
  <g id="background"><rect width="1024" height="1024" fill="url(#bg)"/></g>
  <g id="heart" transform="translate(512 535) scale(0.9) translate(-512 -515)">
    <!-- hinten: absteigende Aorta, rechte Lungenschlagader (hinter Aorta und Hohlvene), Lungenvenen, untere Hohlvene -->
    <path d="M 690 300 C 704 370, 706 440, 700 520" stroke="#7A1515" stroke-width="78" stroke-linecap="round" fill="none"/>
    <path d="M 600 352 C 520 344, 400 352, 318 372" stroke="url(#veinH)" stroke-width="44" stroke-linecap="round" fill="none"/>
    <path d="M 740 436 L 806 424 L 808 446 L 744 462 Z" fill="#9C2522" stroke="#5E0F0F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 746 482 L 810 488 L 806 510 L 744 506 Z" fill="#8A1F1C" stroke="#5E0F0F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 330 436 L 276 428 L 274 450 L 326 462 Z" fill="#9C2522" stroke="#5E0F0F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 328 478 L 278 486 L 282 508 L 330 502 Z" fill="#8A1F1C" stroke="#5E0F0F" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 360 660 C 360 690, 359 715, 358 742" stroke="#2A4C8E" stroke-width="66" stroke-linecap="round" fill="none"/>
    <!-- obere Hohlvene -->
    <path d="M 398 520 C 398 420, 396 320, 394 190" stroke="url(#veinV)" stroke-width="76" stroke-linecap="round" fill="none"/>
    <!-- Abgänge des Aortenbogens: Truncus brachiocephalicus (mit Gabel), linke Halsschlagader, linke Schlüsselbeinarterie -->
    <g transform="translate(506 0)">
      <path d="M 0 262 C -4 220, -8 190, -14 160" stroke="url(#arteryV)" stroke-width="44" stroke-linecap="round" fill="none"/>
      <path d="M -14 165 C -28 140, -42 118, -58 96" stroke="url(#arteryV)" stroke-width="30" stroke-linecap="round" fill="none"/>
      <path d="M -12 165 C -8 138, -4 116, 0 92" stroke="url(#arteryV)" stroke-width="28" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(572 0)">
      <path d="M 0 236 C 2 190, 4 150, 6 104" stroke="url(#arteryV)" stroke-width="32" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(632 0)">
      <path d="M 0 248 C 10 204, 22 166, 40 120" stroke="url(#arteryV)" stroke-width="34" stroke-linecap="round" fill="none"/>
    </g>
    <!-- aufsteigende Aorta und Bogen -->
    <path d="M 505 520 C 498 440, 488 350, 506 300 C 528 246, 640 236, 676 300 L 682 330" stroke="url(#arch)" stroke-width="96" stroke-linecap="round" fill="none"/>
    <path d="M 486 500 C 478 430, 472 360, 486 318" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.18"/>
    <path d="M 455 512 C 448 440, 440 360, 456 310" stroke="#5E0F0F" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- linke Lungenschlagader und Lungenstamm (vorne, aus der rechten Herzkammer) -->
    <path d="M 630 356 C 690 346, 752 352, 814 374" stroke="url(#veinH)" stroke-width="48" stroke-linecap="round" fill="none"/>
    <path d="M 580 560 C 574 486, 580 420, 616 352" stroke="url(#trunk)" stroke-width="98" stroke-linecap="round" fill="none"/>
    <path d="M 538 505 C 566 498, 600 498, 628 508" stroke="#1D3566" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Herzmuskel (Kammern), Spitze nach links unten (vom Betrachter aus rechts) -->
    <path d="M 380 480
             C 300 530, 290 640, 330 720
             C 390 815, 500 870, 610 905
             C 660 920, 698 902, 722 862
             C 796 742, 812 610, 768 512
             C 744 466, 694 452, 652 470
             C 630 520, 540 530, 520 500
             C 470 470, 420 470, 380 480 Z" fill="url(#muscle)" stroke="#5E0F0F" stroke-width="4"/>
    <!-- rechte Kammer etwas heller (vordere Fläche links der Längsfurche) -->
    <path clip-path="url(#ventricles)" d="M 420 520 C 480 505, 560 520, 610 540 C 600 640, 610 760, 650 880 C 560 860, 440 800, 380 720 C 350 650, 370 570, 420 520 Z" fill="#FFFFFF" opacity="0.06"/>
    <!-- rechter Vorhof mit Herzohr (rechter Herzrand) -->
    <path d="M 400 455
             C 330 450, 280 520, 292 610
             C 300 670, 330 705, 372 712
             C 394 650, 410 580, 432 535
             C 452 520, 478 512, 492 496
             C 470 470, 438 456, 400 455 Z" fill="url(#atrium)" stroke="#5E0F0F" stroke-width="3"/>
    <path d="M 430 470 C 456 462, 484 470, 496 494 C 480 500, 462 510, 446 524" stroke="#6E1212" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- linkes Herzohr (gekerbter Rand) -->
    <path d="M 660 470
             C 690 440, 742 440, 770 466
             C 780 478, 774 488, 782 500
             C 790 514, 776 528, 762 530
             C 740 520, 712 522, 690 534
             C 670 520, 656 494, 660 470 Z" fill="#A82020" stroke="#5E0F0F" stroke-width="3"/>
    <!-- Fett in den Kranzfurchen -->
    <g clip-path="url(#ventricles)">
      <g stroke="#F0CF86" stroke-linecap="round" fill="none" opacity="0.5" filter="url(#soft)">
        <path d="M 630 490 C 606 590, 612 720, 664 880" stroke-width="34"/>
        <path d="M 640 600 C 680 612, 716 640, 740 680" stroke-width="16"/>
      </g>
    </g>
    <g stroke="#F0CF86" stroke-linecap="round" fill="none" opacity="0.45" filter="url(#soft)">
      <path d="M 486 500 C 440 566, 402 640, 382 720" stroke-width="30"/>
    </g>
    <!-- Herzkranzgefäße: rechte Kranzarterie in der Kranzfurche, vordere Längsarterie (LAD) mit Ästen, Begleitvene -->
    <g stroke-linecap="round" fill="none">
      <path d="M 486 512 C 440 572, 402 640, 384 716" stroke="#C0302B" stroke-width="12"/>
      <path d="M 410 640 C 440 680, 480 720, 540 760" stroke="#B02A26" stroke-width="7"/>
      <path d="M 630 502 C 608 592, 614 720, 664 868" stroke="#C0302B" stroke-width="13"/>
      <path d="M 642 512 C 618 600, 626 720, 676 862" stroke="#3B5C9C" stroke-width="7"/>
      <path d="M 622 590 C 668 600, 714 628, 744 676" stroke="#B02A26" stroke-width="8"/>
      <path d="M 624 680 C 668 700, 702 736, 720 790" stroke="#B02A26" stroke-width="7"/>
      <path d="M 616 650 C 576 666, 540 668, 500 660" stroke="#B02A26" stroke-width="6"/>
    </g>
    <!-- Glanzlichter -->
    <ellipse cx="470" cy="620" rx="110" ry="64" fill="url(#shine)" transform="rotate(-25 470 620)"/>
    <ellipse cx="560" cy="268" rx="44" ry="16" fill="url(#shine)" transform="rotate(-12 560 268)"/>
    <ellipse cx="596" cy="440" rx="14" ry="40" fill="url(#shine)" transform="rotate(25 596 440)"/>
  </g>
</svg>
