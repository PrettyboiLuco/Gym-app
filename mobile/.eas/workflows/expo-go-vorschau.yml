# Veröffentlicht den aktuellen Stand als Update, das sich direkt in Expo Go öffnen lässt.
# runtimeVersion "sdkVersion" (app.json) ergibt exposdk:58.0.0 – nur dann akzeptiert Expo Go das Update.
name: Expo-Go-Vorschau

jobs:
  vorschau:
    name: Update für Expo Go veröffentlichen
    type: update
    environment: preview
    params:
      branch: vorschau
      platform: ios
